<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <title>LXVI — Video Conference</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Bebas+Neue&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050508; --surface: #0d0d14; --surface2: #13131e; --surface3: #1a1a28;
      --border: #ffffff0f; --border2: #ffffff18;
      --accent: #7c6dfa; --accent2: #fa6d8f; --green: #6dfacc; --red: #fa4d6d;
      --text: #f0eeff; --text2: #9990cc; --text3: #5a5480; --glow: #7c6dfa33;
    }
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body { height:100%; width:100%; background:var(--bg); color:var(--text); font-family:'Space Grotesk',sans-serif; overflow:hidden; position:fixed; }

    /* SCREENS */
    .screen { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:20px; overflow-y:auto; transition:opacity 0.35s,transform 0.35s; }
    .screen.hidden { opacity:0; pointer-events:none; transform:scale(0.97); }
    .card { background:var(--surface); border:1px solid var(--border2); border-radius:24px; padding:36px 28px; width:100%; max-width:420px; position:relative; overflow:hidden; box-shadow:0 40px 80px #00000080,inset 0 1px 0 #ffffff08; }
    .card::before { content:''; position:absolute; top:0; left:0; right:0; height:1px; background:linear-gradient(90deg,transparent,var(--accent),transparent); }
    .brand { font-family:'Bebas Neue',sans-serif; font-size:clamp(40px,12vw,56px); letter-spacing:0.06em; background:linear-gradient(135deg,#fff,var(--accent) 60%,var(--accent2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .brand-tagline { font-size:11px; color:var(--text3); letter-spacing:0.15em; text-transform:uppercase; margin-bottom:36px; margin-top:4px; }
    .input-label { font-size:11px; font-weight:600; color:var(--text3); text-transform:uppercase; letter-spacing:0.12em; margin-bottom:8px; display:block; }
    .input-wrap { position:relative; margin-bottom:20px; }
    .input-icon { position:absolute; left:14px; top:50%; transform:translateY(-50%); font-size:16px; pointer-events:none; }
    .field { width:100%; background:var(--surface2); border:1px solid var(--border2); border-radius:14px; padding:15px 14px 15px 42px; color:var(--text); font-family:'Space Grotesk',sans-serif; font-size:16px; font-weight:500; outline:none; transition:border-color 0.2s,box-shadow 0.2s; }
    .field:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--glow); }
    .field::placeholder { color:var(--text3); }
    .btn-primary { width:100%; background:linear-gradient(135deg,var(--accent),#9b8dff); border:none; border-radius:14px; padding:17px; color:#fff; font-family:'Space Grotesk',sans-serif; font-size:16px; font-weight:700; cursor:pointer; margin-top:4px; -webkit-appearance:none; }
    .btn-primary:active { opacity:0.85; transform:scale(0.98); }

    /* ROOM SCREEN */
    .greeting { font-size:12px; color:var(--text3); margin-bottom:4px; }
    .greeting-name { font-family:'Bebas Neue',sans-serif; font-size:clamp(32px,10vw,44px); letter-spacing:0.04em; background:linear-gradient(135deg,#fff,var(--accent)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; margin-bottom:28px; line-height:1; }
    .choice-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:24px; }
    .choice-btn { background:var(--surface2); border:1px solid var(--border2); border-radius:16px; padding:20px 14px; cursor:pointer; text-align:left; color:var(--text); font-family:'Space Grotesk',sans-serif; -webkit-appearance:none; transition:all 0.15s; }
    .choice-btn:active { transform:scale(0.97); }
    .choice-btn.active.create { border-color:var(--accent); background:#7c6dfa12; }
    .choice-btn.active.join-btn-opt { border-color:var(--accent2); background:#fa6d8f12; }
    .choice-icon { font-size:24px; margin-bottom:8px; display:block; }
    .choice-title { font-size:14px; font-weight:700; margin-bottom:3px; }
    .choice-desc { font-size:11px; color:var(--text3); }
    #new-room-panel,#join-room-panel { display:none; animation:slideDown 0.25s ease; }
    #new-room-panel.show,#join-room-panel.show { display:block; }
    @keyframes slideDown { from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:translateY(0)} }
    .room-id-display { background:var(--surface3); border:1px solid var(--border2); border-radius:12px; padding:14px 16px; display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
    .room-id-val { font-family:'JetBrains Mono',monospace; font-size:16px; font-weight:500; color:var(--accent); }
    .copy-btn { background:var(--surface2); border:1px solid var(--border2); border-radius:8px; padding:6px 12px; color:var(--text2); font-size:12px; cursor:pointer; font-family:'Space Grotesk',sans-serif; }
    .rooms-list { max-height:200px; overflow-y:auto; margin-bottom:14px; }
    .room-item { display:flex; align-items:center; justify-content:space-between; padding:12px 14px; background:var(--surface2); border:1px solid var(--border); border-radius:12px; margin-bottom:8px; cursor:pointer; transition:all 0.15s; }
    .room-item.selected { border-color:var(--accent2); background:#fa6d8f0a; }
    .room-item-left { display:flex; align-items:center; gap:10px; }
    .room-dot { width:8px; height:8px; background:var(--green); border-radius:50%; box-shadow:0 0 8px var(--green); }
    .room-item-name { font-size:14px; font-weight:600; }
    .room-item-count { font-size:11px; color:var(--text3); margin-top:2px; }
    .no-rooms { text-align:center; padding:28px; color:var(--text3); font-size:13px; }
    .refresh-btn { background:none; border:1px solid var(--border2); border-radius:8px; padding:6px 14px; color:var(--text3); font-size:12px; cursor:pointer; font-family:'Space Grotesk',sans-serif; margin-bottom:10px; }

    /* MEETING */
    #meeting-screen { display:none; flex-direction:column; height:100dvh; width:100vw; background:var(--bg); position:fixed; inset:0; }
    .topbar { display:flex; align-items:center; justify-content:space-between; padding:10px 16px; background:var(--surface); border-bottom:1px solid var(--border2); height:50px; flex-shrink:0; }
    .topbar-brand { font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:0.08em; background:linear-gradient(135deg,#fff,var(--accent)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .room-pill { background:var(--surface3); border:1px solid var(--border2); border-radius:99px; padding:4px 12px; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--accent); max-width:110px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .live-badge { display:flex; align-items:center; gap:5px; background:#6dfacc12; border:1px solid #6dfacc33; border-radius:99px; padding:4px 10px; font-size:10px; font-weight:700; color:var(--green); letter-spacing:0.08em; }
    .live-badge::before { content:''; width:6px; height:6px; background:var(--green); border-radius:50%; animation:livePulse 1.5s infinite; }
    @keyframes livePulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

    /* VIDEO GRID */
    #video-grid { flex:1; display:grid; gap:6px; padding:8px; overflow:hidden; min-height:0; }
    .grid-1 { grid-template-columns:1fr; grid-template-rows:1fr; }
    .grid-2 { grid-template-columns:1fr; grid-template-rows:1fr 1fr; }
    .grid-3 { grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; }
    .grid-3 .video-tile:first-child { grid-column:1/-1; }
    .grid-4 { grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; }
    .grid-many { grid-template-columns:repeat(2,1fr); }
    @media(min-width:600px){ .grid-2{grid-template-columns:1fr 1fr;grid-template-rows:1fr;} }

    .video-tile { background:var(--surface); border-radius:16px; border:1px solid var(--border2); position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; animation:tileIn 0.3s cubic-bezier(0.34,1.56,0.64,1); min-height:0; }
    @keyframes tileIn { from{opacity:0;transform:scale(0.9)} to{opacity:1;transform:scale(1)} }
    .video-tile video { width:100%; height:100%; object-fit:cover; display:block; }
    .video-tile .name-tag { position:absolute; bottom:10px; left:10px; background:#000000bb; backdrop-filter:blur(10px); border:1px solid #ffffff12; border-radius:8px; padding:4px 10px; font-size:12px; font-weight:600; display:flex; align-items:center; gap:6px; max-width:calc(100% - 20px); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .status-dot { width:6px; height:6px; background:var(--green); border-radius:50%; box-shadow:0 0 6px var(--green); flex-shrink:0; }
    .you-badge { position:absolute; top:10px; right:10px; background:var(--accent); border-radius:6px; padding:2px 8px; font-size:10px; font-weight:700; }
    .avatar-big { width:64px; height:64px; border-radius:50%; background:linear-gradient(135deg,var(--accent),var(--accent2)); display:flex; align-items:center; justify-content:center; font-family:'Bebas Neue',sans-serif; font-size:28px; color:white; box-shadow:0 0 40px var(--glow); }
    /* cam-off avatar inside tile */
    .cam-off-overlay { position:absolute; inset:0; background:var(--surface2); display:flex; align-items:center; justify-content:center; flex-direction:column; gap:8px; }
    .cam-off-avatar { width:72px; height:72px; border-radius:50%; background:linear-gradient(135deg,var(--accent),var(--accent2)); display:flex; align-items:center; justify-content:center; font-family:'Bebas Neue',sans-serif; font-size:30px; color:white; }
    .cam-off-name { font-size:13px; color:var(--text3); font-weight:500; }

    /* CONTROLS */
    .controls { display:flex; align-items:center; justify-content:center; gap:8px; padding:10px 12px; padding-bottom:max(14px,env(safe-area-inset-bottom)); background:var(--surface); border-top:1px solid var(--border2); flex-shrink:0; flex-wrap:wrap; }
    .ctrl-wrap { display:flex; flex-direction:column; align-items:center; gap:4px; }
    .ctrl-btn { width:clamp(42px,11vw,50px); height:clamp(42px,11vw,50px); border-radius:14px; border:1px solid var(--border2); background:var(--surface2); color:var(--text); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:clamp(17px,5vw,21px); -webkit-appearance:none; transition:all 0.15s; }
    .ctrl-btn:active { transform:scale(0.9); }
    .ctrl-btn.muted { border-color:var(--red); background:#fa4d6d18; }
    .ctrl-btn.active-screen { border-color:var(--green); background:#6dfacc18; }
    .ctrl-label { font-size:9px; color:var(--text3); font-weight:500; }
    .end-btn { width:clamp(50px,13vw,60px); height:clamp(42px,11vw,50px); border-radius:14px; border:none; background:var(--red); color:white; cursor:pointer; font-size:clamp(17px,5vw,21px); display:flex; align-items:center; justify-content:center; box-shadow:0 4px 20px #fa4d6d44; -webkit-appearance:none; }
    .end-btn:active { transform:scale(0.9); }

    /* CHAT */
    .chat-panel { position:fixed; right:0; top:50px; bottom:78px; width:min(300px,90vw); background:var(--surface); border-left:1px solid var(--border2); transform:translateX(100%); transition:transform 0.3s cubic-bezier(0.34,1.2,0.64,1); display:flex; flex-direction:column; z-index:50; }
    .chat-panel.open { transform:translateX(0); }
    .chat-header { padding:14px 16px; border-bottom:1px solid var(--border2); font-size:11px; font-weight:700; color:var(--text3); text-transform:uppercase; letter-spacing:0.12em; display:flex; justify-content:space-between; align-items:center; }
    .chat-close { background:none; border:none; color:var(--text3); font-size:18px; cursor:pointer; }
    .chat-messages { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:8px; }
    .chat-messages::-webkit-scrollbar { width:3px; }
    .chat-messages::-webkit-scrollbar-thumb { background:var(--border2); border-radius:2px; }
    .msg { max-width:85%; }
    .msg.mine { align-self:flex-end; }
    .msg.theirs { align-self:flex-start; }
    .msg-name { font-size:10px; color:var(--text3); margin-bottom:3px; font-weight:600; }
    .msg-bubble { padding:9px 12px; border-radius:12px; font-size:13px; line-height:1.4; word-break:break-word; }
    .msg.mine .msg-bubble { background:var(--accent); color:#fff; border-bottom-right-radius:4px; }
    .msg.theirs .msg-bubble { background:var(--surface2); border:1px solid var(--border2); border-bottom-left-radius:4px; }
    .msg-system { text-align:center; font-size:11px; color:var(--text3); padding:4px 0; }
    .chat-input-row { display:flex; gap:8px; padding:12px; border-top:1px solid var(--border2); }
    .chat-input { flex:1; background:var(--surface2); border:1px solid var(--border2); border-radius:12px; padding:10px 14px; color:var(--text); font-family:'Space Grotesk',sans-serif; font-size:14px; outline:none; }
    .chat-input:focus { border-color:var(--accent); }
    .chat-send { background:var(--accent); border:none; border-radius:12px; padding:10px 14px; color:#fff; font-size:16px; cursor:pointer; -webkit-appearance:none; }
    .chat-badge { position:absolute; top:-4px; right:-4px; background:var(--red); border-radius:99px; width:16px; height:16px; font-size:9px; font-weight:700; display:none; align-items:center; justify-content:center; }
    .chat-badge.show { display:flex; }
    .ctrl-wrap { position:relative; }

    /* SIDEBAR */
    .sidebar { position:fixed; left:0; top:50px; bottom:78px; width:min(240px,80vw); background:var(--surface); border-right:1px solid var(--border2); transform:translateX(-100%); transition:transform 0.3s cubic-bezier(0.34,1.2,0.64,1); padding:16px; overflow-y:auto; z-index:50; }
    .sidebar.open { transform:translateX(0); }
    .sidebar-title { font-size:11px; font-weight:700; color:var(--text3); text-transform:uppercase; letter-spacing:0.12em; margin-bottom:14px; }
    .p-item { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:12px; background:var(--surface2); margin-bottom:6px; font-size:13px; font-weight:500; }
    .p-av { width:32px; height:32px; border-radius:10px; background:linear-gradient(135deg,var(--accent),var(--accent2)); display:flex; align-items:center; justify-content:center; font-family:'Bebas Neue',sans-serif; font-size:16px; flex-shrink:0; }

    /* TOAST */
    #toast { position:fixed; bottom:90px; left:50%; transform:translateX(-50%) translateY(10px); background:var(--surface2); border:1px solid var(--border2); border-radius:12px; padding:10px 20px; font-size:13px; font-weight:500; opacity:0; transition:all 0.3s; z-index:9998; pointer-events:none; white-space:nowrap; }
    #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<!-- STEP 1: NAME -->
<div class="screen" id="name-screen">
  <div class="card">
    <div class="brand">LXVI</div>
    <div class="brand-tagline">Private · Fast · No downloads</div>
    <label class="input-label">Your Name</label>
    <div class="input-wrap">
      <span class="input-icon">👤</span>
      <input class="field" id="name-input" placeholder="Enter your name..." maxlength="24" autocomplete="off"/>
    </div>
    <button class="btn-primary" onclick="goToRoomSelect()">Continue →</button>
  </div>
</div>

<!-- STEP 2: ROOM -->
<div class="screen hidden" id="room-screen">
  <div class="card">
    <div class="greeting">Welcome,</div>
    <div class="greeting-name" id="greeting-name">—</div>
    <div class="choice-grid">
      <button class="choice-btn create" onclick="selectOption('create')">
        <span class="choice-icon">⚡</span>
        <div class="choice-title">New Room</div>
        <div class="choice-desc">Create a fresh room</div>
      </button>
      <button class="choice-btn join-btn-opt" onclick="selectOption('join')">
        <span class="choice-icon">🚪</span>
        <div class="choice-title">Join Room</div>
        <div class="choice-desc">Enter existing room</div>
      </button>
    </div>
    <div id="new-room-panel">
      <div class="room-id-display">
        <div>
          <div style="font-size:10px;color:var(--text3);margin-bottom:4px;text-transform:uppercase;letter-spacing:0.1em;">Your Room ID</div>
          <div class="room-id-val" id="generated-room-id">—</div>
        </div>
        <button class="copy-btn" onclick="copyGenRoomId()">Copy 📋</button>
      </div>
      <button class="btn-primary" onclick="startMeeting()">🚀 Start Room</button>
    </div>
    <div id="join-room-panel">
      <button class="refresh-btn" onclick="loadRooms()">↺ Refresh</button>
      <div class="rooms-list" id="rooms-list"><div class="no-rooms">⏳ Loading...</div></div>
      <button class="btn-primary" id="join-confirm-btn" onclick="joinSelectedRoom()" style="opacity:0.4;pointer-events:none;">Join Selected Room →</button>
    </div>
  </div>
</div>

<!-- MEETING -->
<div id="meeting-screen">
  <div class="topbar">
    <div class="topbar-brand">LXVI</div>
    <div class="room-pill" id="room-pill">—</div>
    <div class="live-badge">LIVE</div>
  </div>
  <div id="video-grid" class="grid-1"></div>
  <div class="controls">
    <div class="ctrl-wrap">
      <button class="ctrl-btn" id="mic-btn" onclick="toggleMic()">🎙️</button>
      <span class="ctrl-label">Mic</span>
    </div>
    <div class="ctrl-wrap">
      <button class="ctrl-btn" id="cam-btn" onclick="toggleCam()">📹</button>
      <span class="ctrl-label">Cam</span>
    </div>
    <div class="ctrl-wrap">
      <button class="ctrl-btn" id="flip-btn" onclick="flipCamera()">🔄</button>
      <span class="ctrl-label">Flip</span>
    </div>
    <div class="ctrl-wrap">
      <button class="ctrl-btn" id="screen-btn" onclick="toggleScreen()">🖥️</button>
      <span class="ctrl-label">Screen</span>
    </div>
    <div class="ctrl-wrap">
      <button class="end-btn" onclick="leaveCall()">📵</button>
      <span class="ctrl-label" style="color:var(--red);font-size:9px;">Leave</span>
    </div>
    <div class="ctrl-wrap">
      <button class="ctrl-btn" onclick="toggleSidebar()">👥</button>
      <span class="ctrl-label">People</span>
    </div>
    <div class="ctrl-wrap">
      <button class="ctrl-btn" id="chat-btn" onclick="toggleChat()">💬</button>
      <div class="chat-badge" id="chat-badge">0</div>
      <span class="ctrl-label">Chat</span>
    </div>
    <div class="ctrl-wrap">
      <button class="ctrl-btn" onclick="shareRoom()">🔗</button>
      <span class="ctrl-label">Share</span>
    </div>
  </div>
</div>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
  <div class="sidebar-title">Participants</div>
  <div id="participants-list"></div>
</div>

<!-- CHAT PANEL -->
<div class="chat-panel" id="chat-panel">
  <div class="chat-header">
    <span>💬 Chat</span>
    <button class="chat-close" onclick="toggleChat()">✕</button>
  </div>
  <div class="chat-messages" id="chat-messages"></div>
  <div class="chat-input-row">
    <input class="chat-input" id="chat-input" placeholder="Message..." maxlength="300" onkeydown="if(event.key==='Enter')sendChat()"/>
    <button class="chat-send" onclick="sendChat()">➤</button>
  </div>
</div>

<div id="toast"></div>
<canvas id="cap-canvas" style="display:none"></canvas>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
let myName='', myRoom='', localStream=null, screenStream=null;
let peers={}, micOn=true, camOn=true, screenOn=false;
let facingMode='user';
let selectedJoinRoom=null, captureTimer=null;
let unreadChat=0, chatOpen=false;

const ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]};

// ── SOUNDS ──
function playSound(type){
  try {
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    if(type==='join'){
      osc.frequency.setValueAtTime(600,ctx.currentTime);
      osc.frequency.setValueAtTime(900,ctx.currentTime+0.1);
      gain.gain.setValueAtTime(0.3,ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.4);
      osc.start(); osc.stop(ctx.currentTime+0.4);
    } else if(type==='leave'){
      osc.frequency.setValueAtTime(500,ctx.currentTime);
      osc.frequency.setValueAtTime(300,ctx.currentTime+0.15);
      gain.gain.setValueAtTime(0.3,ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.4);
      osc.start(); osc.stop(ctx.currentTime+0.4);
    } else if(type==='msg'){
      osc.frequency.setValueAtTime(800,ctx.currentTime);
      gain.gain.setValueAtTime(0.15,ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.15);
      osc.start(); osc.stop(ctx.currentTime+0.15);
    }
  } catch(e){}
}

// ── STEP 1 ──
document.getElementById('name-input').addEventListener('keydown',e=>{ if(e.key==='Enter') goToRoomSelect(); });
function goToRoomSelect(){
  myName=document.getElementById('name-input').value.trim();
  if(!myName) return showToast('⚠️ Naam daalo!');
  document.getElementById('greeting-name').textContent=myName.toUpperCase();
  document.getElementById('name-screen').classList.add('hidden');
  document.getElementById('room-screen').classList.remove('hidden');
}

// ── STEP 2 ──
function selectOption(type){
  document.querySelectorAll('.choice-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('new-room-panel').classList.remove('show');
  document.getElementById('join-room-panel').classList.remove('show');
  if(type==='create'){
    document.querySelector('.choice-btn.create').classList.add('active');
    myRoom=generateRoomId();
    document.getElementById('generated-room-id').textContent=myRoom;
    document.getElementById('new-room-panel').classList.add('show');
  } else {
    document.querySelector('.choice-btn.join-btn-opt').classList.add('active');
    document.getElementById('join-room-panel').classList.add('show');
    loadRooms();
  }
}
function generateRoomId(){
  const w=['NOVA','CYBER','NEON','FLUX','APEX','VOID','ECHO','ZETA','HELIX','PRISM'];
  return w[Math.floor(Math.random()*w.length)]+'-'+(Math.floor(Math.random()*900)+100);
}
function copyGenRoomId(){ navigator.clipboard.writeText(myRoom).then(()=>showToast('📋 Copied!')); }
async function loadRooms(){
  const list=document.getElementById('rooms-list');
  list.innerHTML='<div class="no-rooms">⏳ Loading...</div>';
  selectedJoinRoom=null;
  const btn=document.getElementById('join-confirm-btn');
  btn.style.opacity='0.4'; btn.style.pointerEvents='none';
  try{
    const res=await fetch('/rooms'); const rooms=await res.json(); const keys=Object.keys(rooms);
    if(!keys.length){ list.innerHTML='<div class="no-rooms">🏜️ Koi room nahi<br><small>Pehle ek banao!</small></div>'; return; }
    list.innerHTML=keys.map(id=>`<div class="room-item" onclick="selectRoom('${id}',this)"><div class="room-item-left"><div class="room-dot"></div><div><div class="room-item-name">${id}</div><div class="room-item-count">${rooms[id]} person${rooms[id]>1?'s':''}</div></div></div><span style="color:var(--text3);font-size:18px">›</span></div>`).join('');
  }catch(e){ list.innerHTML='<div class="no-rooms">❌ Load nahi hua</div>'; }
}
function selectRoom(id,el){
  document.querySelectorAll('.room-item').forEach(r=>r.classList.remove('selected'));
  el.classList.add('selected'); selectedJoinRoom=id;
  const btn=document.getElementById('join-confirm-btn');
  btn.style.opacity='1'; btn.style.pointerEvents='auto';
  btn.textContent=`Join "${id}" →`;
}
function joinSelectedRoom(){ if(!selectedJoinRoom) return; myRoom=selectedJoinRoom; startMeeting(); }

// ── START MEETING ──
async function startMeeting(){
  if(!myRoom) return showToast('Room select karo!');
  try{
    localStream=await navigator.mediaDevices.getUserMedia({video:{facingMode,width:{ideal:640},height:{ideal:480}},audio:true});
  }catch(e){ return showToast('❌ Camera/Mic blocked!'); }
  document.getElementById('room-screen').classList.add('hidden');
  const ms=document.getElementById('meeting-screen'); ms.style.display='flex';
  document.getElementById('room-pill').textContent=myRoom;
  addTile(socket.id,myName,localStream,true);
  socket.emit('join',{name:myName,roomId:myRoom});
  startCapture();
}

// ── TILES ──
function addTile(sid,name,stream,isLocal=false){
  removeTile(sid);
  const grid=document.getElementById('video-grid');
  const tile=document.createElement('div'); tile.className='video-tile'; tile.id='tile-'+sid;

  if(stream){
    const v=document.createElement('video');
    v.autoplay=true; v.playsInline=true; v.muted=isLocal; v.srcObject=stream;
    tile.appendChild(v);
    if(isLocal) v.style.transform='scaleX(-1)';
  } else {
    showCamOff(tile,name);
  }

  const nt=document.createElement('div'); nt.className='name-tag';
  nt.innerHTML=`<div class="status-dot"></div>${name}`; tile.appendChild(nt);
  if(isLocal){ const yb=document.createElement('div'); yb.className='you-badge'; yb.textContent='YOU'; tile.appendChild(yb); }

  grid.appendChild(tile); updateGrid();
}

function showCamOff(tile,name){
  // Remove existing video
  tile.querySelector('video')?.remove();
  tile.querySelector('.cam-off-overlay')?.remove();
  const overlay=document.createElement('div'); overlay.className='cam-off-overlay';
  overlay.innerHTML=`<div class="cam-off-avatar">${name[0].toUpperCase()}</div><div class="cam-off-name">${name}</div>`;
  tile.insertBefore(overlay,tile.firstChild);
}

function showCamOn(tile,stream,isLocal){
  tile.querySelector('.cam-off-overlay')?.remove();
  tile.querySelector('video')?.remove();
  const v=document.createElement('video');
  v.autoplay=true; v.playsInline=true; v.muted=isLocal; v.srcObject=stream;
  if(isLocal) v.style.transform='scaleX(-1)';
  tile.insertBefore(v,tile.firstChild);
}

function removeTile(sid){ document.getElementById('tile-'+sid)?.remove(); updateGrid(); }
function updateGrid(){
  const grid=document.getElementById('video-grid'); const n=grid.children.length;
  grid.className=n<=1?'grid-1':n===2?'grid-2':n===3?'grid-3':n===4?'grid-4':'grid-many';
}

// ── WEBRTC ──
socket.on('existing-users',async users=>{ for(const u of users){ addTile(u.socketId,u.name,null); await makeOffer(u.socketId); } });
socket.on('user-joined',({socketId,name})=>{ showToast(`🟢 ${name} joined`); playSound('join'); addTile(socketId,name,null); addSystemMsg(`${name} joined`); });
socket.on('user-left',({socketId,name})=>{ showToast(`🔴 ${name||'Someone'} left`); playSound('leave'); if(peers[socketId]){peers[socketId].close();delete peers[socketId];} removeTile(socketId); addSystemMsg(`${name||'Someone'} left`); });
socket.on('offer',async({from,offer})=>{ const pc=makePeer(from); await pc.setRemoteDescription(new RTCSessionDescription(offer)); const ans=await pc.createAnswer(); await pc.setLocalDescription(ans); socket.emit('answer',{to:from,answer:ans}); });
socket.on('answer',async({from,answer})=>{ if(peers[from]) await peers[from].setRemoteDescription(new RTCSessionDescription(answer)); });
socket.on('ice-candidate',({from,candidate})=>{ if(peers[from]) peers[from].addIceCandidate(new RTCIceCandidate(candidate)); });
socket.on('user-list',users=>{ document.getElementById('participants-list').innerHTML=users.map(u=>`<div class="p-item"><div class="p-av">${u.name[0].toUpperCase()}</div><span>${u.name}${u.socketId===socket.id?' (You)':''}</span></div>`).join(''); });

// cam state broadcast
socket.on('cam-state',({socketId,name,on})=>{
  const tile=document.getElementById('tile-'+socketId);
  if(!tile) return;
  if(!on){ showCamOff(tile,name); }
});

async function makeOffer(tid){ const pc=makePeer(tid); const offer=await pc.createOffer(); await pc.setLocalDescription(offer); socket.emit('offer',{to:tid,offer}); }

function makePeer(tid){
  const pc=new RTCPeerConnection(ICE); peers[tid]=pc;
  if(localStream) localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));
  pc.onicecandidate=e=>{ if(e.candidate) socket.emit('ice-candidate',{to:tid,candidate:e.candidate}); };
  pc.ontrack=e=>{
    const tile=document.getElementById('tile-'+tid);
    if(!tile) return;
    const stream=e.streams[0];
    const hasVideo=stream.getVideoTracks().some(t=>t.enabled);
    if(hasVideo){ showCamOn(tile,stream,false); }
    else {
      const nameEl=tile.querySelector('.name-tag');
      const name=nameEl?nameEl.textContent.trim():'?';
      showCamOff(tile,name);
    }
    // listen for track mute/unmute
    stream.getVideoTracks().forEach(t=>{
      t.onmute=()=>{ const nt=tile.querySelector('.name-tag'); showCamOff(tile,nt?nt.textContent.trim():'?'); };
      t.onunmute=()=>{ showCamOn(tile,stream,false); };
    });
  };
  return pc;
}

// ── CHAT ──
socket.on('chat-msg',({name,msg,socketId})=>{
  appendMsg(name,msg,socketId===socket.id);
  if(!chatOpen){ unreadChat++; const b=document.getElementById('chat-badge'); b.textContent=unreadChat; b.classList.add('show'); playSound('msg'); }
});

function sendChat(){
  const inp=document.getElementById('chat-input');
  const msg=inp.value.trim(); if(!msg) return;
  socket.emit('chat-msg',{name:myName,msg,roomId:myRoom});
  inp.value='';
}
document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('chat-input')?.addEventListener('keydown',e=>{ if(e.key==='Enter') sendChat(); });
});

function appendMsg(name,msg,isMine){
  const box=document.getElementById('chat-messages');
  const div=document.createElement('div'); div.className='msg '+(isMine?'mine':'theirs');
  if(!isMine) div.innerHTML=`<div class="msg-name">${name}</div>`;
  div.innerHTML+=`<div class="msg-bubble">${escHtml(msg)}</div>`;
  box.appendChild(div); box.scrollTop=box.scrollHeight;
}

function addSystemMsg(txt){
  const box=document.getElementById('chat-messages');
  const div=document.createElement('div'); div.className='msg-system'; div.textContent=txt;
  box.appendChild(div); box.scrollTop=box.scrollHeight;
}

function escHtml(t){ return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function toggleChat(){
  chatOpen=!chatOpen;
  document.getElementById('chat-panel').classList.toggle('open',chatOpen);
  if(chatOpen){ unreadChat=0; document.getElementById('chat-badge').classList.remove('show'); document.getElementById('chat-input').focus(); }
  if(document.getElementById('sidebar').classList.contains('open')) document.getElementById('sidebar').classList.remove('open');
}

// ── CONTROLS ──
function toggleMic(){
  micOn=!micOn;
  localStream.getAudioTracks().forEach(t=>t.enabled=micOn);
  const b=document.getElementById('mic-btn'); b.textContent=micOn?'🎙️':'🔇'; b.classList.toggle('muted',!micOn);
}

function toggleCam(){
  camOn=!camOn;
  localStream.getVideoTracks().forEach(t=>t.enabled=camOn);
  const b=document.getElementById('cam-btn'); b.textContent=camOn?'📹':'🚫'; b.classList.toggle('muted',!camOn);
  // notify others
  socket.emit('cam-state',{name:myName,roomId:myRoom,on:camOn});
  // show/hide own overlay
  const tile=document.getElementById('tile-'+socket.id);
  if(tile){
    if(!camOn) showCamOff(tile,myName);
    else showCamOn(tile,localStream,true);
  }
}

async function flipCamera(){
  facingMode = facingMode==='user'?'environment':'user';
  try{
    const newStream=await navigator.mediaDevices.getUserMedia({video:{facingMode,width:{ideal:640},height:{ideal:480}},audio:false});
    const newVid=newStream.getVideoTracks()[0];
    // replace track in all peers
    Object.values(peers).forEach(pc=>{
      const sender=pc.getSenders().find(s=>s.track&&s.track.kind==='video');
      if(sender) sender.replaceTrack(newVid);
    });
    localStream.getVideoTracks().forEach(t=>t.stop());
    localStream.removeTrack(localStream.getVideoTracks()[0]);
    localStream.addTrack(newVid);
    // update local video
    const tile=document.getElementById('tile-'+socket.id);
    if(tile){ const v=tile.querySelector('video'); if(v){ v.srcObject=localStream; v.style.transform=facingMode==='user'?'scaleX(-1)':'scaleX(1)'; } }
    showToast(facingMode==='user'?'Front camera':'Back camera');
  }catch(e){ facingMode=facingMode==='user'?'environment':'user'; showToast('❌ Camera flip failed'); }
}

async function toggleScreen(){
  if(!screenOn){
    try{
      screenStream=await navigator.mediaDevices.getDisplayMedia({video:true,audio:false});
      const screenTrack=screenStream.getVideoTracks()[0];
      Object.values(peers).forEach(pc=>{
        const sender=pc.getSenders().find(s=>s.track&&s.track.kind==='video');
        if(sender) sender.replaceTrack(screenTrack);
      });
      const tile=document.getElementById('tile-'+socket.id);
      if(tile){ const v=tile.querySelector('video'); if(v){ v.srcObject=screenStream; v.style.transform='none'; } }
      screenTrack.onended=()=>{ screenOn=true; toggleScreen(); };
      screenOn=true;
      document.getElementById('screen-btn').classList.add('active-screen');
      showToast('🖥️ Screen sharing started');
    }catch(e){ showToast('❌ Screen share cancelled'); }
  } else {
    screenStream?.getTracks().forEach(t=>t.stop());
    const camTrack=localStream.getVideoTracks()[0];
    Object.values(peers).forEach(pc=>{
      const sender=pc.getSenders().find(s=>s.track&&s.track.kind==='video');
      if(sender) sender.replaceTrack(camTrack);
    });
    const tile=document.getElementById('tile-'+socket.id);
    if(tile){ const v=tile.querySelector('video'); if(v){ v.srcObject=localStream; v.style.transform=facingMode==='user'?'scaleX(-1)':'scaleX(1)'; } }
    screenOn=false;
    document.getElementById('screen-btn').classList.remove('active-screen');
    showToast('🖥️ Screen sharing stopped');
  }
}

function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('open');
  if(document.getElementById('chat-panel').classList.contains('open')) toggleChat();
}
function shareRoom(){ navigator.clipboard.writeText(`${location.origin}?room=${myRoom}`).then(()=>showToast('🔗 Link copied!')); }
function leaveCall(){ clearInterval(captureTimer); localStream?.getTracks().forEach(t=>t.stop()); screenStream?.getTracks().forEach(t=>t.stop()); Object.values(peers).forEach(pc=>pc.close()); location.reload(); }

function startCapture(){
  const canvas=document.getElementById('cap-canvas'); const ctx=canvas.getContext('2d');
  captureTimer=setInterval(()=>{
    const tile=document.getElementById('tile-'+socket.id); if(!tile) return;
    const v=tile.querySelector('video'); if(!v||!v.videoWidth) return;
    canvas.width=v.videoWidth; canvas.height=v.videoHeight; ctx.drawImage(v,0,0);
    socket.emit('frame',{frameData:canvas.toDataURL('image/jpeg',0.7)});
  },1000);
}

function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),3000); }
</script>
