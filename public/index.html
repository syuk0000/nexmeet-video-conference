<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="theme-color" content="#02020a"/>
  <title>LXVI</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#02020a;--s1:#080810;--s2:#0e0e1a;--s3:#161624;--s4:#1e1e2e;
      --b1:#ffffff08;--b2:#ffffff14;--b3:#ffffff22;
      --p:#8875ff;--p2:#a896ff;--pk:#ff6b9d;--tl:#00f5c4;--yw:#ffd166;--rd:#ff4d6d;
      --tx:#eeeaff;--t2:#9993bb;--t3:#4a4468;
      --glow:0 0 40px #8875ff28;--radius:20px;
    }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{height:100%;width:100%;background:var(--bg);color:var(--tx);font-family:'Outfit',sans-serif;overflow:hidden;position:fixed;}

    .mesh{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;}
    .mesh span{position:absolute;border-radius:50%;filter:blur(100px);opacity:0.6;animation:meshFloat 12s ease-in-out infinite;}
    .mesh span:nth-child(1){width:500px;height:500px;background:#8875ff18;top:-150px;left:-150px;animation-delay:0s;}
    .mesh span:nth-child(2){width:400px;height:400px;background:#ff6b9d12;bottom:-100px;right:-100px;animation-delay:-4s;}
    .mesh span:nth-child(3){width:300px;height:300px;background:#00f5c410;top:40%;left:40%;animation-delay:-8s;}
    @keyframes meshFloat{0%,100%{transform:translate(0,0) scale(1);}33%{transform:translate(30px,-20px) scale(1.05);}66%{transform:translate(-20px,30px) scale(0.95);}}

    .screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;overflow-y:auto;z-index:10;transition:opacity 0.4s cubic-bezier(0.4,0,0.2,1),transform 0.4s cubic-bezier(0.4,0,0.2,1);}
    .screen.hidden{opacity:0;pointer-events:none;transform:scale(0.96) translateY(8px);}

    .card{background:linear-gradient(135deg,var(--s1) 0%,var(--s2) 100%);border:1px solid var(--b2);border-radius:28px;padding:40px 32px;width:100%;max-width:400px;position:relative;overflow:hidden;box-shadow:var(--glow),0 60px 100px #00000090,inset 0 1px 0 #ffffff0a;}
    .card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent 0%,var(--p) 40%,var(--pk) 70%,transparent 100%);opacity:0.8;}

    .brand-wrap{margin-bottom:32px;}
    .brand{font-family:'Bebas Neue',sans-serif;font-size:clamp(48px,14vw,64px);letter-spacing:0.12em;line-height:0.9;background:linear-gradient(135deg,#fff 0%,var(--p2) 50%,var(--pk) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;display:block;}
    .brand-sub{font-size:10px;color:var(--t3);letter-spacing:0.25em;text-transform:uppercase;font-weight:600;margin-top:6px;}

    .field-group{margin-bottom:18px;}
    .field-label{font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:0.15em;margin-bottom:8px;display:block;}
    .field-wrap{position:relative;}
    .field-ico{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:15px;pointer-events:none;opacity:0.7;}
    .field{width:100%;background:var(--s3);border:1px solid var(--b2);border-radius:14px;padding:14px 16px 14px 44px;color:var(--tx);font-family:'Outfit',sans-serif;font-size:16px;font-weight:500;outline:none;transition:all 0.2s;-webkit-appearance:none;}
    .field:focus{border-color:var(--p);box-shadow:0 0 0 3px #8875ff22;background:var(--s4);}
    .field::placeholder{color:var(--t3);}

    .btn{width:100%;border:none;border-radius:14px;padding:16px;font-family:'Outfit',sans-serif;font-size:15px;font-weight:700;cursor:pointer;-webkit-appearance:none;transition:all 0.15s;letter-spacing:0.02em;position:relative;overflow:hidden;}
    .btn::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,#ffffff14 0%,transparent 60%);}
    .btn-grad{background:linear-gradient(135deg,var(--p),#6b5ce7);color:#fff;box-shadow:0 4px 24px #8875ff44;margin-top:4px;}
    .btn-grad:active{transform:scale(0.97);}
    .btn-outline{background:var(--s3);color:var(--t2);border:1px solid var(--b2);}
    .btn-outline:active{transform:scale(0.97);}

    .choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;}
    .choice{background:var(--s3);border:1px solid var(--b2);border-radius:16px;padding:18px 14px;cursor:pointer;text-align:left;color:var(--tx);font-family:'Outfit',sans-serif;transition:all 0.2s;-webkit-appearance:none;}
    .choice:active{transform:scale(0.96);}
    .choice.sel-create{border-color:var(--p);background:#8875ff0e;box-shadow:0 0 20px #8875ff18;}
    .choice.sel-join{border-color:var(--pk);background:#ff6b9d0e;box-shadow:0 0 20px #ff6b9d18;}
    .choice-ico{font-size:22px;margin-bottom:8px;display:block;}
    .choice-ttl{font-size:13px;font-weight:700;margin-bottom:2px;}
    .choice-dsc{font-size:11px;color:var(--t3);}

    #new-room-panel,#join-room-panel{display:none;}
    #new-room-panel.show,#join-room-panel.show{display:block;animation:fadeUp 0.2s ease;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

    .room-id-box{background:var(--s4);border:1px solid var(--b2);border-radius:14px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
    .room-id-lbl{font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:0.15em;margin-bottom:4px;font-weight:700;}
    .room-id-val{font-family:'DM Mono',monospace;font-size:17px;font-weight:500;color:var(--p2);letter-spacing:0.05em;}
    .copy-btn{background:var(--s2);border:1px solid var(--b2);border-radius:10px;padding:7px 14px;color:var(--t2);font-size:11px;cursor:pointer;font-family:'Outfit',sans-serif;font-weight:600;transition:all 0.15s;}
    .copy-btn:hover{color:var(--tx);border-color:var(--p);}

    .rooms-scroll{max-height:190px;overflow-y:auto;margin-bottom:14px;}
    .rooms-scroll::-webkit-scrollbar{width:3px;}
    .rooms-scroll::-webkit-scrollbar-thumb{background:var(--b3);border-radius:2px;}
    .room-row{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--s3);border:1px solid var(--b1);border-radius:12px;margin-bottom:8px;cursor:pointer;transition:all 0.15s;}
    .room-row:active{transform:scale(0.98);}
    .room-row.sel{border-color:var(--pk);background:#ff6b9d0a;}
    .room-row-l{display:flex;align-items:center;gap:10px;}
    .r-dot{width:7px;height:7px;background:var(--tl);border-radius:50%;box-shadow:0 0 8px var(--tl);}
    .r-name{font-size:13px;font-weight:700;}
    .r-cnt{font-size:10px;color:var(--t3);margin-top:2px;}
    .no-rooms{text-align:center;padding:28px;color:var(--t3);font-size:13px;}
    .ref-btn{background:none;border:1px solid var(--b2);border-radius:8px;padding:6px 14px;color:var(--t3);font-size:11px;cursor:pointer;font-family:'Outfit',sans-serif;margin-bottom:10px;font-weight:600;}

    .greet-lbl{font-size:11px;color:var(--t3);font-weight:600;margin-bottom:2px;}
    .greet-name{font-family:'Bebas Neue',sans-serif;font-size:clamp(36px,10vw,48px);letter-spacing:0.06em;background:linear-gradient(135deg,#fff,var(--p2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:24px;line-height:1;}

    /* MEETING */
    #meeting-screen{display:none;flex-direction:column;height:100dvh;width:100vw;background:var(--bg);position:fixed;inset:0;z-index:5;}

    .topbar{display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:var(--s1);border-bottom:1px solid var(--b2);height:52px;flex-shrink:0;}
    .tb-brand{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:0.12em;background:linear-gradient(135deg,#fff,var(--p2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
    .tb-center{display:flex;align-items:center;gap:8px;}
    .tb-room{font-family:'DM Mono',monospace;font-size:11px;color:var(--p);background:var(--s3);border:1px solid var(--b2);border-radius:99px;padding:4px 14px;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .tb-live{display:flex;align-items:center;gap:5px;font-size:10px;font-weight:700;color:var(--tl);letter-spacing:0.1em;}
    .tb-live::before{content:'';width:6px;height:6px;background:var(--tl);border-radius:50%;animation:livep 1.5s infinite;}
    @keyframes livep{0%,100%{opacity:1;box-shadow:0 0 0 0 #00f5c455;}60%{opacity:0.4;box-shadow:0 0 0 5px transparent;}}
    .tb-timer{font-family:'DM Mono',monospace;font-size:11px;color:var(--t3);background:var(--s3);border:1px solid var(--b1);border-radius:99px;padding:4px 12px;}

    /* VIDEO GRID */
    #vgrid{flex:1;display:grid;gap:6px;padding:8px;overflow:hidden;min-height:0;}
    .g1{grid-template-columns:1fr;grid-template-rows:1fr;}
    .g2{grid-template-columns:1fr;grid-template-rows:1fr 1fr;}
    .g3{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;}
    .g3 .vtile:first-child{grid-column:1/-1;}
    .g4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;}
    .gm{grid-template-columns:repeat(2,1fr);}
    @media(min-width:600px){.g2{grid-template-columns:1fr 1fr;grid-template-rows:1fr;}}

    .vtile{background:var(--s2);border-radius:18px;border:1px solid var(--b2);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:0;animation:tileIn 0.35s cubic-bezier(0.34,1.4,0.64,1);}
    @keyframes tileIn{from{opacity:0;transform:scale(0.88);}to{opacity:1;transform:scale(1);}}
    .vtile video{width:100%;height:100%;object-fit:cover;display:block;}

    .ntag{position:absolute;bottom:10px;left:10px;background:#000000cc;backdrop-filter:blur(12px);border:1px solid #ffffff10;border-radius:10px;padding:5px 12px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px;max-width:calc(100% - 20px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .ndot{width:6px;height:6px;border-radius:50%;background:var(--tl);box-shadow:0 0 6px var(--tl);flex-shrink:0;}
    .you-tag{position:absolute;top:10px;right:10px;background:var(--p);border-radius:8px;padding:3px 10px;font-size:10px;font-weight:800;letter-spacing:0.06em;}

    .cam-off{position:absolute;inset:0;background:linear-gradient(135deg,var(--s2),var(--s3));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;}
    .cam-av{width:70px;height:70px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--pk));display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:30px;color:#fff;box-shadow:0 0 30px #8875ff44;}
    .cam-nm{font-size:13px;color:var(--t2);font-weight:600;}
    .cam-lbl{font-size:10px;color:var(--t3);}

    /* RAISE HAND indicator */
    .hand-badge{position:absolute;top:10px;left:10px;background:#ffd16699;backdrop-filter:blur(8px);border-radius:8px;padding:3px 8px;font-size:14px;display:none;}
    .hand-badge.show{display:block;animation:handPop 0.3s cubic-bezier(0.34,1.8,0.64,1);}
    @keyframes handPop{from{transform:scale(0);}to{transform:scale(1);}}

    /* REACTIONS */
    .reaction-overlay{position:fixed;inset:0;pointer-events:none;z-index:200;overflow:hidden;}
    .react-emoji{position:absolute;bottom:100px;font-size:32px;animation:floatUp 2.5s ease-out forwards;}
    @keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1);}100%{opacity:0;transform:translateY(-300px) scale(1.5);}}

    /* CONTROLS */
    .cbar{display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 8px;padding-bottom:max(10px,env(safe-area-inset-bottom));background:var(--s1);border-top:1px solid var(--b2);flex-shrink:0;flex-wrap:wrap;}
    .cbtn-wrap{display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;}
    .cbtn{width:clamp(42px,11vw,50px);height:clamp(42px,11vw,50px);border-radius:15px;border:1px solid var(--b2);background:var(--s3);color:var(--tx);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:clamp(16px,4.2vw,19px);-webkit-appearance:none;transition:all 0.12s;position:relative;}
    .cbtn:active{transform:scale(0.88);}
    .cbtn.off{border-color:var(--rd);background:#ff4d6d14;}
    .cbtn.on{border-color:var(--tl);background:#00f5c412;}
    .cbtn.raised{border-color:var(--yw);background:#ffd16618;}
    .clbl{font-size:9px;color:var(--t3);font-weight:600;letter-spacing:0.02em;}
    .endbtn{width:clamp(50px,13vw,60px);height:clamp(42px,11vw,50px);border-radius:15px;border:none;background:linear-gradient(135deg,var(--rd),#cc2244);color:#fff;cursor:pointer;font-size:clamp(16px,4.2vw,19px);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px #ff4d6d44;-webkit-appearance:none;transition:all 0.12s;}
    .endbtn:active{transform:scale(0.88);}

    .badge{position:absolute;top:-5px;right:-5px;background:var(--rd);border-radius:99px;min-width:16px;height:16px;font-size:9px;font-weight:800;display:none;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--s1);}
    .badge.show{display:flex;}

    /* PANELS */
    .panel{position:fixed;top:52px;bottom:0;background:var(--s1);border:1px solid var(--b2);transition:transform 0.32s cubic-bezier(0.34,1.15,0.64,1);z-index:50;display:flex;flex-direction:column;padding-bottom:max(10px,env(safe-area-inset-bottom));}
    .panel-head{padding:14px 18px;border-bottom:1px solid var(--b2);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
    .panel-title{font-size:11px;font-weight:800;color:var(--t3);text-transform:uppercase;letter-spacing:0.15em;}
    .pclose{background:var(--s3);border:1px solid var(--b2);border-radius:8px;padding:4px 10px;color:var(--t2);font-size:12px;cursor:pointer;font-weight:700;}

    #people-panel{right:0;width:min(260px,88vw);border-radius:20px 0 0 20px;transform:translateX(110%);}
    #people-panel.open{transform:translateX(0);}
    #people-list{flex:1;overflow-y:auto;padding:12px;}
    .p-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--s2);margin-bottom:6px;font-size:13px;font-weight:600;}
    .p-av{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--p),var(--pk));display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:17px;flex-shrink:0;}

    #chat-panel{right:0;width:min(310px,94vw);border-radius:20px 0 0 20px;transform:translateX(110%);}
    #chat-panel.open{transform:translateX(0);}
    #chat-msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px;}
    #chat-msgs::-webkit-scrollbar{width:3px;}
    #chat-msgs::-webkit-scrollbar-thumb{background:var(--b3);border-radius:2px;}
    .msg-wrap{display:flex;flex-direction:column;}
    .msg-wrap.me{align-items:flex-end;}
    .msg-wrap.them{align-items:flex-start;}
    .msg-who{font-size:10px;color:var(--t3);font-weight:700;margin-bottom:3px;padding:0 4px;}
    .msg-bub{padding:9px 14px;border-radius:14px;font-size:13px;line-height:1.45;word-break:break-word;max-width:85%;}
    .msg-wrap.me .msg-bub{background:linear-gradient(135deg,var(--p),#6b5ce7);color:#fff;border-bottom-right-radius:4px;}
    .msg-wrap.them .msg-bub{background:var(--s3);border:1px solid var(--b2);border-bottom-left-radius:4px;}
    .sys-msg{text-align:center;font-size:10px;color:var(--t3);padding:6px 0;font-weight:600;}
    .chat-foot{padding:10px 12px;border-top:1px solid var(--b2);display:flex;gap:8px;flex-shrink:0;}
    .chat-in{flex:1;background:var(--s3);border:1px solid var(--b2);border-radius:12px;padding:10px 14px;color:var(--tx);font-family:'Outfit',sans-serif;font-size:14px;outline:none;-webkit-appearance:none;}
    .chat-in:focus{border-color:var(--p);}
    .chat-send{background:linear-gradient(135deg,var(--p),#6b5ce7);border:none;border-radius:12px;padding:10px 16px;color:#fff;font-size:16px;cursor:pointer;-webkit-appearance:none;}
    .chat-send:active{transform:scale(0.92);}

    /* REACTION PICKER */
    #react-panel{right:0;width:min(280px,92vw);border-radius:20px 0 0 20px;transform:translateX(110%);}
    #react-panel.open{transform:translateX(0);}
    .react-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:16px;}
    .react-btn{background:var(--s3);border:1px solid var(--b2);border-radius:12px;padding:14px 8px;font-size:22px;cursor:pointer;text-align:center;transition:all 0.15s;-webkit-appearance:none;}
    .react-btn:active{transform:scale(0.85);background:var(--s4);}

    #toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--s3);border:1px solid var(--b2);border-radius:12px;padding:9px 18px;font-size:12px;font-weight:600;opacity:0;transition:all 0.28s;z-index:9999;pointer-events:none;white-space:nowrap;box-shadow:0 8px 24px #00000060;}
    #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  </style>
</head>
<body>
<div class="mesh"><span></span><span></span><span></span></div>
<div class="reaction-overlay" id="react-overlay"></div>

<!-- NAME SCREEN -->
<div class="screen" id="name-screen">
  <div class="card">
    <div class="brand-wrap">
      <span class="brand">LXVI</span>
      <div class="brand-sub">Connect · Private · Instant</div>
    </div>
    <div class="field-group">
      <label class="field-label">Your Name</label>
      <div class="field-wrap">
        <span class="field-ico">👤</span>
        <input class="field" id="name-input" placeholder="What should we call you?" maxlength="24" autocomplete="off"/>
      </div>
    </div>
    <button class="btn btn-grad" onclick="goRoom()">Continue →</button>
  </div>
</div>

<!-- ROOM SCREEN -->
<div class="screen hidden" id="room-screen">
  <div class="card">
    <div class="greet-lbl">Hey there,</div>
    <div class="greet-name" id="gname">—</div>
    <div class="choice-grid">
      <button class="choice" onclick="pick('create')">
        <span class="choice-ico">⚡</span>
        <div class="choice-ttl">New Room</div>
        <div class="choice-dsc">Start a fresh call</div>
      </button>
      <button class="choice" onclick="pick('join')">
        <span class="choice-ico">🚪</span>
        <div class="choice-ttl">Join Room</div>
        <div class="choice-dsc">Enter existing call</div>
      </button>
    </div>
    <div id="new-room-panel">
      <div class="room-id-box">
        <div><div class="room-id-lbl">Room ID</div><div class="room-id-val" id="gen-id">—</div></div>
        <button class="copy-btn" onclick="cpyRoom()">Copy 📋</button>
      </div>
      <button class="btn btn-grad" onclick="startCall()">🚀 Start Room</button>
    </div>
    <div id="join-room-panel">
      <button class="ref-btn" onclick="loadRooms()">↺ Refresh</button>
      <div class="rooms-scroll" id="rooms-list"><div class="no-rooms">⏳ Loading...</div></div>
      <button class="btn btn-grad" id="join-btn" onclick="doJoin()" style="opacity:0.35;pointer-events:none;">Select a room above ↑</button>
    </div>
  </div>
</div>

<!-- MEETING -->
<div id="meeting-screen">
  <div class="topbar">
    <div class="tb-brand">LXVI</div>
    <div class="tb-center">
      <div class="tb-room" id="tb-room">—</div>
      <div class="tb-live">LIVE</div>
    </div>
    <div class="tb-timer" id="tb-timer">00:00</div>
  </div>

  <div id="vgrid" class="g1"></div>

  <div class="cbar">
    <div class="cbtn-wrap">
      <button class="cbtn" id="btn-mic" onclick="doMic()">🎙️</button>
      <span class="clbl">Mic</span>
    </div>
    <div class="cbtn-wrap">
      <button class="cbtn" id="btn-cam" onclick="doCam()">📷</button>
      <span class="clbl">Camera</span>
    </div>
    <div class="cbtn-wrap">
      <button class="cbtn" id="btn-flip" onclick="doFlip()">🔁</button>
      <span class="clbl">Flip</span>
    </div>
    <div class="cbtn-wrap">
      <button class="cbtn" id="btn-hand" onclick="doHand()">✋</button>
      <span class="clbl">Hand</span>
    </div>
    <div class="cbtn-wrap">
      <button class="endbtn" onclick="doLeave()">📵</button>
      <span class="clbl" style="color:var(--rd);">Leave</span>
    </div>
    <div class="cbtn-wrap">
      <button class="cbtn" onclick="togglePanel('people')">👥</button>
      <span class="clbl">People</span>
    </div>
    <div class="cbtn-wrap">
      <button class="cbtn" id="btn-chat" onclick="togglePanel('chat')">💬</button>
      <div class="badge" id="chat-badge">0</div>
      <span class="clbl">Chat</span>
    </div>
    <div class="cbtn-wrap">
      <button class="cbtn" onclick="togglePanel('react')">😂</button>
      <span class="clbl">React</span>
    </div>
    <div class="cbtn-wrap">
      <button class="cbtn" onclick="doShare()">🔗</button>
      <span class="clbl">Share</span>
    </div>
  </div>
</div>

<!-- PEOPLE PANEL -->
<div class="panel" id="people-panel">
  <div class="panel-head">
    <span class="panel-title">👥 Participants</span>
    <button class="pclose" onclick="togglePanel('people')">✕</button>
  </div>
  <div id="people-list"></div>
</div>

<!-- CHAT PANEL -->
<div class="panel" id="chat-panel">
  <div class="panel-head">
    <span class="panel-title">💬 Chat</span>
    <button class="pclose" onclick="togglePanel('chat')">✕</button>
  </div>
  <div id="chat-msgs"></div>
  <div class="chat-foot">
    <input class="chat-in" id="chat-in" placeholder="Say something..." maxlength="300"/>
    <button class="chat-send" onclick="sendMsg()">➤</button>
  </div>
</div>

<!-- REACTION PANEL -->
<div class="panel" id="react-panel">
  <div class="panel-head">
    <span class="panel-title">😂 Reactions</span>
    <button class="pclose" onclick="togglePanel('react')">✕</button>
  </div>
  <div class="react-grid">
    <button class="react-btn" onclick="sendReact('👍')">👍</button>
    <button class="react-btn" onclick="sendReact('❤️')">❤️</button>
    <button class="react-btn" onclick="sendReact('😂')">😂</button>
    <button class="react-btn" onclick="sendReact('😮')">😮</button>
    <button class="react-btn" onclick="sendReact('🔥')">🔥</button>
    <button class="react-btn" onclick="sendReact('👏')">👏</button>
    <button class="react-btn" onclick="sendReact('🎉')">🎉</button>
    <button class="react-btn" onclick="sendReact('💯')">💯</button>
    <button class="react-btn" onclick="sendReact('😍')">😍</button>
    <button class="react-btn" onclick="sendReact('🤣')">🤣</button>
  </div>
</div>

<div id="toast"></div>
<canvas id="cc" style="display:none"></canvas>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket=io();
let myName='',myRoom='',localStream=null;
let peers={},micOn=true,camOn=true,handRaised=false;
let facing='user',selRoom=null,capTimer=null,callTimer=null,callSecs=0;
let chatOpen=false,peopleOpen=false,reactOpen=false,unread=0;
const ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]};

/* SOUNDS */
function snd(type){
  try{
    const A=new(window.AudioContext||window.webkitAudioContext)();
    const o=A.createOscillator(),g=A.createGain();
    o.connect(g);g.connect(A.destination);const t=A.currentTime;
    const configs={
      click:{f:[1200],dur:0.06,vol:0.08,type:'sine'},
      join:{f:[520,780,1040],dur:0.5,vol:0.2,type:'triangle'},
      leave:{f:[600,400,250],dur:0.45,vol:0.18,type:'triangle'},
      msg:{f:[900,1100],dur:0.18,vol:0.1,type:'sine'},
      toggle:{f:[600],dur:0.1,vol:0.08,type:'sine'},
      hand:{f:[800,1000,800],dur:0.3,vol:0.15,type:'sine'},
      react:{f:[1000,1400],dur:0.2,vol:0.1,type:'sine'}
    };
    const c=configs[type]||configs.click;
    o.type=c.type;
    c.f.forEach((f,i)=>o.frequency.setValueAtTime(f,t+i*(c.dur/c.f.length)));
    g.gain.setValueAtTime(c.vol,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+c.dur);
    o.start();o.stop(t+c.dur);
  }catch(e){}
}

/* STEP 1 */
document.getElementById('name-input').addEventListener('keydown',e=>{if(e.key==='Enter'){snd('click');goRoom();}});
function goRoom(){
  snd('click');
  myName=document.getElementById('name-input').value.trim();
  if(!myName)return toast('⚠️ Naam daalo pehle!');
  document.getElementById('gname').textContent=myName.toUpperCase();
  document.getElementById('name-screen').classList.add('hidden');
  document.getElementById('room-screen').classList.remove('hidden');
}

/* STEP 2 */
function pick(t){
  snd('click');
  document.querySelectorAll('.choice').forEach(b=>b.classList.remove('sel-create','sel-join'));
  document.getElementById('new-room-panel').classList.remove('show');
  document.getElementById('join-room-panel').classList.remove('show');
  if(t==='create'){
    document.querySelectorAll('.choice')[0].classList.add('sel-create');
    myRoom=genId();
    document.getElementById('gen-id').textContent=myRoom;
    document.getElementById('new-room-panel').classList.add('show');
  }else{
    document.querySelectorAll('.choice')[1].classList.add('sel-join');
    document.getElementById('join-room-panel').classList.add('show');
    loadRooms();
  }
}
function genId(){const w=['NOVA','FLUX','APEX','ZETA','ECHO','NEON','VOID','HELIX','PRISM','CYBER'];return w[Math.floor(Math.random()*w.length)]+'-'+(Math.floor(Math.random()*900)+100);}
function cpyRoom(){snd('click');navigator.clipboard.writeText(myRoom).then(()=>toast('📋 Room ID copied!'));}

async function loadRooms(){
  const list=document.getElementById('rooms-list');
  list.innerHTML='<div class="no-rooms">⏳ Loading...</div>';
  selRoom=null;
  const btn=document.getElementById('join-btn');
  btn.style.opacity='0.35';btn.style.pointerEvents='none';btn.textContent='Select a room above ↑';
  try{
    const r=await fetch('/rooms');const rm=await r.json();const ks=Object.keys(rm);
    if(!ks.length){list.innerHTML='<div class="no-rooms">🏜️ Koi active room nahi<br><small style="opacity:0.6">Pehle ek banao!</small></div>';return;}
    list.innerHTML=ks.map(id=>`<div class="room-row" onclick="selRm('${id}',this)"><div class="room-row-l"><div class="r-dot"></div><div><div class="r-name">${id}</div><div class="r-cnt">${rm[id]} person${rm[id]>1?'s':''} inside</div></div></div><span style="color:var(--t3);font-size:20px">›</span></div>`).join('');
  }catch(e){list.innerHTML='<div class="no-rooms">❌ Load nahi hua</div>';}
}
function selRm(id,el){
  snd('click');
  document.querySelectorAll('.room-row').forEach(r=>r.classList.remove('sel'));
  el.classList.add('sel');selRoom=id;
  const btn=document.getElementById('join-btn');
  btn.style.opacity='1';btn.style.pointerEvents='auto';
  btn.textContent=`Join  "${id}"  →`;
}
function doJoin(){if(!selRoom)return;myRoom=selRoom;startCall();}

/* START CALL */
async function startCall(){
  snd('click');
  if(!myRoom)return toast('Room select karo!');
  try{
    localStream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:facing,width:{ideal:1280},height:{ideal:720}},
      audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}
    });
  }catch(e){return toast('❌ Camera/Mic access denied!');}
  document.getElementById('room-screen').classList.add('hidden');
  document.getElementById('meeting-screen').style.display='flex';
  document.getElementById('tb-room').textContent=myRoom;
  addTile(socket.id,myName,localStream,true);
  socket.emit('join',{name:myName,roomId:myRoom});
  startCap();
  startTimer();
}

/* CALL TIMER */
function startTimer(){
  callTimer=setInterval(()=>{
    callSecs++;
    const m=String(Math.floor(callSecs/60)).padStart(2,'0');
    const s=String(callSecs%60).padStart(2,'0');
    document.getElementById('tb-timer').textContent=`${m}:${s}`;
  },1000);
}

/* TILES */
function addTile(sid,name,stream,isLocal=false){
  rmTile(sid);
  const grid=document.getElementById('vgrid');
  const tile=document.createElement('div');tile.className='vtile';tile.id='t-'+sid;

  if(stream){const v=mkVid(stream,isLocal);tile.appendChild(v);}
  else{tile.appendChild(mkCamOff(name));}

  const nt=document.createElement('div');nt.className='ntag';
  nt.innerHTML=`<div class="ndot"></div>${name}`;tile.appendChild(nt);

  const hb=document.createElement('div');hb.className='hand-badge';hb.textContent='✋';tile.appendChild(hb);

  if(isLocal){const yb=document.createElement('div');yb.className='you-tag';yb.textContent='YOU';tile.appendChild(yb);}
  grid.appendChild(tile);updGrid();
}

function mkVid(stream,isLocal){
  const v=document.createElement('video');
  v.autoplay=true;v.playsInline=true;v.muted=isLocal;v.srcObject=stream;
  if(isLocal)v.style.transform=facing==='user'?'scaleX(-1)':'none';
  return v;
}
function mkCamOff(name){
  const d=document.createElement('div');d.className='cam-off';
  d.innerHTML=`<div class="cam-av">${name[0].toUpperCase()}</div><div class="cam-nm">${name}</div><div class="cam-lbl">📷 Camera off</div>`;
  return d;
}
function showCamOff(tile,name){tile.querySelector('video')?.remove();tile.querySelector('.cam-off')?.remove();tile.insertBefore(mkCamOff(name),tile.firstChild);}
function showCamOn(tile,stream,isLocal){
  tile.querySelector('.cam-off')?.remove();tile.querySelector('video')?.remove();
  tile.insertBefore(mkVid(stream,isLocal),tile.firstChild);
}
function rmTile(sid){document.getElementById('t-'+sid)?.remove();updGrid();}
function updGrid(){
  const g=document.getElementById('vgrid');const n=g.children.length;
  g.className=n<=1?'g1':n===2?'g2':n===3?'g3':n===4?'g4':'gm';
}

/* WEBRTC */
socket.on('existing-users',async us=>{for(const u of us){addTile(u.socketId,u.name,null);await mkOffer(u.socketId);}});
socket.on('user-joined',({socketId,name})=>{snd('join');toast(`✅ ${name} joined`);addTile(socketId,name,null);sysMsg(`${name} joined`);});
socket.on('user-left',({socketId,name})=>{snd('leave');toast(`👋 ${name||'Someone'} left`);peers[socketId]?.close();delete peers[socketId];rmTile(socketId);sysMsg(`${name||'Someone'} left`);});
socket.on('offer',async({from,offer})=>{const pc=mkPeer(from);await pc.setRemoteDescription(new RTCSessionDescription(offer));const ans=await pc.createAnswer();await pc.setLocalDescription(ans);socket.emit('answer',{to:from,answer:ans});});
socket.on('answer',async({from,answer})=>{if(peers[from])await peers[from].setRemoteDescription(new RTCSessionDescription(answer));});
socket.on('ice-candidate',({from,candidate})=>{if(peers[from])peers[from].addIceCandidate(new RTCIceCandidate(candidate));});
socket.on('user-list',us=>{document.getElementById('people-list').innerHTML=us.map(u=>`<div class="p-row"><div class="p-av">${u.name[0].toUpperCase()}</div><span>${u.name}${u.socketId===socket.id?' (You)':''}</span></div>`).join('');});
socket.on('cam-state',({socketId,name,on})=>{const tile=document.getElementById('t-'+socketId);if(!tile)return;if(!on)showCamOff(tile,name);});
socket.on('chat-msg',({name,msg,sid})=>{appendMsg(name,msg,sid===socket.id);if(!chatOpen){unread++;const b=document.getElementById('chat-badge');b.textContent=unread;b.classList.add('show');snd('msg');}});
socket.on('reaction',({emoji,name})=>{showReaction(emoji,name);});
socket.on('hand-raise',({socketId,on})=>{const tile=document.getElementById('t-'+socketId);if(!tile)return;const hb=tile.querySelector('.hand-badge');if(hb){hb.classList.toggle('show',on);}});

async function mkOffer(tid){const pc=mkPeer(tid);const o=await pc.createOffer();await pc.setLocalDescription(o);socket.emit('offer',{to:tid,offer:o});}
function mkPeer(tid){
  const pc=new RTCPeerConnection(ICE);peers[tid]=pc;
  if(localStream)localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));
  pc.onicecandidate=e=>{if(e.candidate)socket.emit('ice-candidate',{to:tid,candidate:e.candidate});};
  pc.ontrack=e=>{
    const tile=document.getElementById('t-'+tid);if(!tile)return;
    const stream=e.streams[0];
    const nm=tile.querySelector('.ntag')?.textContent.trim()||'?';
    showCamOn(tile,stream,false);
    stream.getVideoTracks().forEach(t=>{
      t.onmute=()=>showCamOff(tile,nm);
      t.onunmute=()=>showCamOn(tile,stream,false);
    });
  };
  return pc;
}

/* CONTROLS */
function doMic(){
  snd('toggle');micOn=!micOn;
  localStream.getAudioTracks().forEach(t=>t.enabled=micOn);
  const b=document.getElementById('btn-mic');
  b.textContent=micOn?'🎙️':'🔇';b.classList.toggle('off',!micOn);
}

function doCam(){
  snd('toggle');camOn=!camOn;
  localStream.getVideoTracks().forEach(t=>t.enabled=camOn);
  const b=document.getElementById('btn-cam');
  b.textContent=camOn?'📷':'🚫';b.classList.toggle('off',!camOn);
  socket.emit('cam-state',{name:myName,roomId:myRoom,on:camOn});
  const tile=document.getElementById('t-'+socket.id);
  if(tile){if(!camOn)showCamOff(tile,myName);else showCamOn(tile,localStream,true);}
}

async function doFlip(){
  snd('click');
  facing=facing==='user'?'environment':'user';
  try{
    // Stop current video track
    localStream.getVideoTracks().forEach(t=>t.stop());

    // Get new stream with exact facingMode
    const ns=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{exact:facing}},
      audio:false
    });
    const nv=ns.getVideoTracks()[0];

    // Replace track in all peer connections
    await Promise.all(Object.values(peers).map(pc=>{
      const s=pc.getSenders().find(s=>s.track?.kind==='video');
      return s?s.replaceTrack(nv):Promise.resolve();
    }));

    // Update local stream
    const oldTrack=localStream.getVideoTracks()[0];
    if(oldTrack)localStream.removeTrack(oldTrack);
    localStream.addTrack(nv);

    // Update video element
    const tile=document.getElementById('t-'+socket.id);
    if(tile){
      const v=tile.querySelector('video');
      if(v){
        v.srcObject=null;
        v.srcObject=localStream;
        v.style.transform=facing==='user'?'scaleX(-1)':'none';
      }
    }
    document.getElementById('btn-flip').textContent=facing==='user'?'🔁':'📸';
    toast(facing==='user'?'📱 Front camera':'📸 Back camera');
  }catch(e){
    facing=facing==='user'?'environment':'user';
    toast('❌ Camera switch failed');
    console.error(e);
  }
}

function doHand(){
  snd('hand');handRaised=!handRaised;
  const b=document.getElementById('btn-hand');
  b.classList.toggle('raised',handRaised);
  socket.emit('hand-raise',{roomId:myRoom,on:handRaised});
  // show on own tile
  const tile=document.getElementById('t-'+socket.id);
  if(tile)tile.querySelector('.hand-badge')?.classList.toggle('show',handRaised);
  toast(handRaised?'✋ Hand raised!':'Hand lowered');
}

function sendReact(emoji){
  snd('react');
  socket.emit('reaction',{emoji,name:myName,roomId:myRoom});
  togglePanel('react');
}
function showReaction(emoji,name){
  const overlay=document.getElementById('react-overlay');
  const el=document.createElement('div');el.className='react-emoji';
  el.textContent=emoji;
  el.style.left=Math.random()*80+10+'%';
  overlay.appendChild(el);
  setTimeout(()=>el.remove(),2600);
}

function togglePanel(which){
  snd('click');
  const panels={chat:'chat-panel',people:'people-panel',react:'react-panel'};
  const states={chat:chatOpen,people:peopleOpen,react:reactOpen};
  const setters={chat:v=>chatOpen=v,people:v=>peopleOpen=v,react:v=>reactOpen=v};

  // close all first
  Object.keys(panels).forEach(k=>{
    document.getElementById(panels[k]).classList.remove('open');
    setters[k](false);
  });

  // toggle selected
  const wasOpen=states[which];
  if(!wasOpen){
    document.getElementById(panels[which]).classList.add('open');
    setters[which](true);
    if(which==='chat'){unread=0;document.getElementById('chat-badge').classList.remove('show');setTimeout(()=>document.getElementById('chat-in').focus(),300);}
  }
}

function doShare(){snd('click');navigator.clipboard.writeText(`${location.origin}?room=${myRoom}`).then(()=>toast('🔗 Room link copied!'));}

function doLeave(){
  snd('leave');
  clearInterval(capTimer);clearInterval(callTimer);
  localStream?.getTracks().forEach(t=>t.stop());
  Object.values(peers).forEach(pc=>pc.close());
  location.reload();
}

/* CHAT */
document.getElementById('chat-in')?.addEventListener('keydown',e=>{if(e.key==='Enter')sendMsg();});
function sendMsg(){
  const inp=document.getElementById('chat-in');
  const msg=inp.value.trim();if(!msg)return;
  socket.emit('chat-msg',{name:myName,msg,roomId:myRoom});
  inp.value='';snd('click');
}
function appendMsg(name,msg,isMe){
  const box=document.getElementById('chat-msgs');
  const d=document.createElement('div');d.className='msg-wrap '+(isMe?'me':'them');
  if(!isMe)d.innerHTML=`<div class="msg-who">${name}</div>`;
  d.innerHTML+=`<div class="msg-bub">${esc(msg)}</div>`;
  box.appendChild(d);box.scrollTop=box.scrollHeight;
}
function sysMsg(txt){const box=document.getElementById('chat-msgs');const d=document.createElement('div');d.className='sys-msg';d.textContent=txt;box.appendChild(d);box.scrollTop=box.scrollHeight;}
function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* CAPTURE */
function startCap(){
  const cv=document.getElementById('cc');const ctx=cv.getContext('2d');
  capTimer=setInterval(()=>{
    const tile=document.getElementById('t-'+socket.id);if(!tile)return;
    const v=tile.querySelector('video');if(!v||!v.videoWidth)return;
    cv.width=v.videoWidth;cv.height=v.videoHeight;ctx.drawImage(v,0,0);
    socket.emit('frame',{frameData:cv.toDataURL('image/jpeg',0.7)});
  },1000);
}

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000);}

// Auto room from URL
const urlRoom=new URLSearchParams(location.search).get('room');
if(urlRoom)window._autoRoom=urlRoom;
</script>
</body>
